<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Belezalizando - TikTok</title>
<style>body{font-family:system-ui,Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{display:block;word-break:break-all;background:#f4f4f4;padding:12px;border-radius:6px}button{margin-top:12px;padding:10px 16px;border:0;border-radius:6px;background:#c2185b;color:#fff;font-size:1em;cursor:pointer}</style></head><body>
<h1>Belezalizando</h1>
<div id="ok" hidden><p>Conta do TikTok autorizada. Copie o código abaixo e cole no Claude Code.</p><p>TikTok account authorized. Copy the code below.</p><code id="code"></code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent);this.textContent='Copiado!'">Copiar código</button></div>
<div id="err" hidden><p>A autorização não foi concluída: <span id="msg"></span></p></div>
<div id="none"><p>Esta página recebe o retorno da autorização do TikTok.</p></div>
<script>
var p=new URLSearchParams(location.search);
if(p.get('code')){document.getElementById('none').hidden=true;document.getElementById('ok').hidden=false;document.getElementById('code').textContent=p.get('code');}
else if(p.get('error')){document.getElementById('none').hidden=true;document.getElementById('err').hidden=false;document.getElementById('msg').textContent=p.get('error')+' '+(p.get('error_description')||'');}
</script>
<p><a href="./">Belezalizando</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
</body></html>
